[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsp"
version = "0.1.0"
description = "Weight-space programming experiments for Bayesian materials discovery"
requires-python = ">=3.10"
dependencies = ["torch", "numpy"]

[project.optional-dependencies]
experiments = ["botorch", "gpytorch", "scikit-learn", "scipy", "pandas"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
