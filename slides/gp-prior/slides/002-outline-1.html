<!--NOTES
The first section states the problem. A Gaussian process is the usual surrogate in Bayesian optimisation of materials, and a campaign starts with a handful of labelled alloys. I will show how well the plain Gaussian process ranks unseen alloys at 5, 10, 20 and 50 labels on the five tasks used in this talk, and what it gets wrong even with its full training set: it underpredicts the best candidates and its intervals are too narrow in places.
