The sixth section asks whether the same written network helps a Bayesian neural network. A written network can be used in three ways there: as a prior mean in function space, as it was for the Gaussian process; as the starting point of training or of a sampling chain; or as the centre of a prior over the weights. I compare the three on MC dropout, a deep ensemble and Hamiltonian Monte Carlo, with ranking and 95 percent coverage as the measures.
